[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-simulator"
version = "0.1.0"
description = "Agent-based prediction-market and financial-market research simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "polars>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
rl = ["gymnasium>=0.29", "torch>=2.2", "stable-baselines3>=2.3"]
plot = ["matplotlib>=3.8", "seaborn>=0.13"]
scale = ["ray>=2.20"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
market-sim = "market_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

