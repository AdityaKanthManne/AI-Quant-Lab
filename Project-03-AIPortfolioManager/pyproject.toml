[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-portfolio-manager"
version = "0.1.0"
description = "Point-in-time quantitative portfolio research and simulation platform"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "cvxpy>=1.5",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "mlflow>=2.17",
  "numpy>=1.26",
  "optuna>=4.0",
  "polars>=1.12",
  "pydantic-settings>=2.6",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
advanced = [
  "hmmlearn>=0.3",
  "lightgbm>=4.5",
  "statsmodels>=0.14",
  "torch>=2.4",
  "xgboost>=2.1",
]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.7",
]

[project.scripts]
portfolio-demo = "ai_portfolio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_portfolio"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

