[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prediction-market-agents"
version = "0.1.0"
description = "Research platform for calibrated multi-agent probabilistic forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "mlflow>=2.16,<4",
  "numpy>=1.26,<3",
  "polars>=1.8,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "pytest-cov>=5,<7", "ruff>=0.7,<1"]
torch = ["torch>=2.2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_market_agents"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

