services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      RESEARCH_COPILOT_HOME: /app/research_projects
      DATABASE_URL: postgresql+psycopg://research:research@postgres:5432/research_copilot
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes: ["./research_projects:/app/research_projects"]
    depends_on: [postgres, qdrant, mlflow]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research_copilot
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5001:5000"]
    volumes: ["mlflow_data:/mlflow"]
volumes:
  postgres_data:
  qdrant_data:
  mlflow_data:

