[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-quant-research-copilot"
version = "0.1.0"
description = "Reproducible, agentic infrastructure for quantitative research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2",
  "mlflow>=2.17",
  "numpy>=2.0",
  "polars>=1.12",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "qdrant-client>=1.12",
  "scipy>=1.14",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]
torch = ["torch>=2.5"]

[project.scripts]
research-copilot = "research_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

